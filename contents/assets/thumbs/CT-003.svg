<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="LIVE画面風のスマホの中で、吹き出しが1つずつ出る図。視聴者が1人入室し、配信者が迎えて名前の読み方を確かめ、視聴者が答える。配信者がいまの話題を聞き、視聴者の返事を受けて「みんなは何派？」と広げると、ほかの視聴者もコメントする。要所の吹き出しには「気づいていると伝える」「返しやすい入口」「参加」「枠全体の会話」という意味が1つずつ小さく出る。" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',Meiryo,sans-serif"><rect x="0" y="0" width="960" height="540" rx="0" fill="#171c21"/><circle cx="480" cy="250" r="330" fill="#232a31"/><rect x="348" y="24" width="280" height="492" rx="38" fill="#0d1013"/><rect x="356" y="32" width="264" height="476" rx="31" fill="#3f5f6b"/><circle cx="488" cy="174" r="46" fill="#f6d2b6"/><rect x="396" y="228" width="184" height="300" rx="70" fill="#f3ead9"/><path d="M436,170 a52,56 0 0 1 104,0 q-30,-30 -52,-34 q-28,22 -52,34 z" fill="#33262a"/><rect x="356" y="274" width="264" height="234" rx="0" fill="#000000" opacity="0.42"/><rect x="370" y="54" width="50" height="22" rx="5" fill="#e5484d"/><text x="395" y="70" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">LIVE</text><rect x="370" y="443.7" width="113" height="46.3" rx="14" fill="#000000" opacity="0.42"/><text x="383" y="459.7" font-size="10.5" font-weight="700" fill="#8fd3ff" text-anchor="start">たく</text><text x="383" y="477.7" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="start">ツナマヨ一択</text><rect x="370" y="389.4" width="127.5" height="46.3" rx="14" fill="#000000" opacity="0.42"/><text x="383" y="405.4" font-size="10.5" font-weight="700" fill="#8fd3ff" text-anchor="start">みか</text><text x="383" y="423.4" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="start">わたしも鮭派！</text><rect x="406" y="335.1" width="200" height="46.3" rx="14" fill="#ffffff"/><text x="419" y="351.1" font-size="10.5" font-weight="700" fill="#5f6871" text-anchor="start">配信者</text><text x="419" y="369.1" font-size="14.5" font-weight="700" fill="#1b2126" text-anchor="start">鮭いいね！みんなは何派？</text><rect x="370" y="280.8" width="84" height="46.3" rx="14" fill="#000000" opacity="0.42"/><text x="383" y="296.8" font-size="10.5" font-weight="700" fill="#8fd3ff" text-anchor="start">ゆう</text><text x="383" y="314.8" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="start">鮭派です</text><rect x="377" y="206.2" width="229" height="66.6" rx="14" fill="#ffffff"/><text x="390" y="222.2" font-size="10.5" font-weight="700" fill="#5f6871" text-anchor="start">配信者</text><text x="390" y="240.2" font-size="14.5" font-weight="700" fill="#1b2126" text-anchor="start">よかった！今、好きなおにぎり</text><text x="390" y="260.5" font-size="14.5" font-weight="700" fill="#1b2126" text-anchor="start">の具の話してたんだ。ゆうさ…</text><rect x="370" y="151.9" width="113" height="46.3" rx="14" fill="#000000" opacity="0.42"/><text x="383" y="167.9" font-size="10.5" font-weight="700" fill="#8fd3ff" text-anchor="start">ゆう</text><text x="383" y="185.9" font-size="14.5" font-weight="600" fill="#ffffff" text-anchor="start">合ってます！</text><rect x="672" y="176" width="214" height="52" rx="26" fill="#232a31"/><text x="779" y="210" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">1人</text><path d="M779,232 v10 m-6,-6 l6,7 l6,-7" fill="none" stroke="#b9c1c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="672" y="250" width="214" height="52" rx="26" fill="#232a31"/><text x="779" y="284" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">配信者と</text><path d="M779,306 v10 m-6,-6 l6,7 l6,-7" fill="none" stroke="#b9c1c9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="672" y="324" width="214" height="52" rx="26" fill="#ffe27a"/><text x="779" y="358" font-size="21" font-weight="800" fill="#1b2126" text-anchor="middle">枠全体へ</text><rect x="74" y="236" width="214" height="52" rx="26" fill="#232a31"/><text x="181" y="270" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">最初の一言</text></svg>